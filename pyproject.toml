[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccpool"
version = "0.1.0"
description = "Pool Claude Team seats for Claude Code, with API / Bedrock / LiteLLM as paid fallback."
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
bedrock = ["anthropic[bedrock]>=2.8"]
test = ["pytest>=8", "pytest-aiohttp>=1.0", "anthropic[bedrock]>=2.8"]

[project.scripts]
ccpool = "ccpool.__main__:main"

[tool.setuptools]
packages = ["ccpool"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
